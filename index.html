<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo da Velha - Prolog</title>

    <script src="https://cdn.jsdelivr.net/npm/tau-prolog/modules/core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tau-prolog/modules/lists.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }

        table {
            width: 300px;
            height: 300px;
            table-layout: fixed;
            border-collapse: collapse;
        }

        td {
            width: 100px;
            height: 100px;
            background: lightgreen;
            border: 4px solid white; 
            text-align: center;
            vertical-align: middle;
            font-size: 3em;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>

<body>

<h1>Jogo da Velha</h1>

<div class="container">
    <table>
        <tr>
            <td></td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td></td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td></td>
            <td></td>
            <td></td>
        </tr>
    </table>
</div>

<script>
    const estados = ["", "X", "O"];

    document.querySelectorAll("td").forEach(td => {
        td.addEventListener("click", () => {
            const atual = td.textContent.trim();
            const indice = estados.indexOf(atual);
            td.textContent = estados[(indice + 1) % estados.length];
        });
    });
</script>

</body>
</html>
